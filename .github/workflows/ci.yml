# EhViewer@Lab CI — build + unit tests on every PR and main push.
# Replaces the upstream workflows, which only triggered on BiLi_PC_Gamer and
# therefore never ran in this repository (and never ran tests anywhere).
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v6

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        run: ./gradlew :app:assembleAppReleaseDebug --no-daemon

      # A hard gate since #21: the suite is green (73/73), so any red is a real
      # regression. Do not reintroduce continue-on-error — a test that cannot fail
      # the build constrains nothing, which is the whole point of #40.
      - name: Unit tests
        id: tests
        run: ./gradlew :app:testAppReleaseDebugUnitTest --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ehviewer-lab-debug
          path: app/build/outputs/apk/appRelease/debug/*.apk
